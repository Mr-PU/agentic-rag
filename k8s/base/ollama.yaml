apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: agentic-rag
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi # model weights are large; gemma3:12b alone is ~8GB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentic-rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: "4Gi" }
            limits: { cpu: "4", memory: "16Gi" }
            # To schedule onto a GPU node pool, uncomment:
            # limits:
            #   nvidia.com/gpu: 1
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ollama-pvc }
      # nodeSelector:
      #   workload: gpu
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentic-rag
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
