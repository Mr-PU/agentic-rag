# DEV-ONLY DEFAULT CREDENTIALS.
# These match the docker-compose defaults so the app "just works" out of the box
# on a local kind/minikube cluster. Replace every value here (and re-apply) before
# using this anywhere reachable by anyone but you — e.g. via
#   kubectl create secret generic rag-secrets -n agentic-rag \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
#     ... --dry-run=client -o yaml > k8s/base/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: agentic-rag
type: Opaque
stringData:
  POSTGRES_USER: "rag"
  POSTGRES_PASSWORD: "rag"
  POSTGRES_DB: "rag"
  POSTGRES_DSN: "postgresql+psycopg2://rag:rag@postgres:5432/rag"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
