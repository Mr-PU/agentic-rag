apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentic-rag
spec:
  replicas: 2 # ingestion workers scale independently of the API
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: agentic-rag-api:local # same image as the API, different command
          imagePullPolicy: IfNotPresent
          command: ["rq", "worker", "--url", "redis://redis:6379/0", "ingest"]
          envFrom:
            - configMapRef: { name: rag-config }
          env:
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: rag-secrets, key: POSTGRES_DSN } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: S3_SECRET_KEY } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
