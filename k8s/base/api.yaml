apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: agentic-rag-api:local
          imagePullPolicy: IfNotPresent # built locally and loaded into the cluster — see README
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rag-config }
          env:
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: rag-secrets, key: POSTGRES_DSN } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: S3_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic-rag
spec:
  selector: { app: api }
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
