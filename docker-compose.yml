version: "3.9"

x-app-env: &app-env
  # Host machine Ollama
  OLLAMA_BASE_URL: http://host.docker.internal:11434

  # Data infrastructure
  QDRANT_URL: http://qdrant:6333

  POSTGRES_DSN: postgresql+psycopg2://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}

  REDIS_URL: redis://redis:6379/0

  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: documents
  S3_SECURE: "false"

  # Models available in host Ollama
  GENERATOR_MODEL: ${GENERATOR_MODEL:-gemma3:12b}
  CRITIC_MODEL: ${CRITIC_MODEL:-gemma3:12b}
  ROUTER_MODEL: ${ROUTER_MODEL:-qwen3:1.7b}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}

  # Embedding dimension
  EMBED_DIM: ${EMBED_DIM:-768}

  # RAG configuration
  TOP_K: ${TOP_K:-6}
  MAX_ITERATIONS: ${MAX_ITERATIONS:-3}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}


services:

  # ============================================================
  # DATA INFRASTRUCTURE
  # ============================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/6333' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: rag-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rag-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # APPLICATION API
  # ============================================================

  api:
    build: ./backend
    container_name: rag-api

    ports:
      - "8000:8000"

    # Required on Linux to access host Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *app-env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

      qdrant:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:8000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # RQ WORKER
  # ============================================================

  worker:
    build: ./backend
    container_name: rag-worker

    command:
      [
        "rq",
        "worker",
        "--url",
        "redis://redis:6379/0",
        "ingest"
      ]

    # Required on Linux to access host Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *app-env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      api:
        condition: service_healthy

    restart: unless-stopped

    # Scale with:
    # docker compose up --scale worker=3
    deploy:
      replicas: 1


# ==============================================================
# PERSISTENT VOLUMES
# ==============================================================

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  minio_data: