x-app-env: &app-env
  # Default: use Ollama already running on your host machine (this is the common
  # case if you installed Ollama normally and have `ollama list` showing models).
  # host.docker.internal resolves to the host from inside a container on Docker
  # Desktop automatically; on native Linux Docker Engine the extra_hosts entry
  # below (on api/worker) is what makes it resolve.
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  QDRANT_URL: http://qdrant:6333
  POSTGRES_DSN: postgresql+psycopg2://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: documents
  S3_SECURE: "false"
  GENERATOR_MODEL: ${GENERATOR_MODEL:-mistral:latest}
  CRITIC_MODEL: ${CRITIC_MODEL:-mistral:latest}
  ROUTER_MODEL: ${ROUTER_MODEL:-qwen3:1.7b}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  EMBED_DIM: ${EMBED_DIM:-768}
  TOP_K: ${TOP_K:-6}
  MAX_ITERATIONS: ${MAX_ITERATIONS:-3}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}

services:

  # NOTE: no `ollama` service here by default — the app talks to Ollama already
  # running on your host (see OLLAMA_BASE_URL above). If you don't have Ollama
  # installed on the host, use docker-compose.ollama.yml instead — see README.

  # ---------- Data infrastructure ----------

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO removed the minio/minio image from Docker Hub — pull from their own
    # quay.io registry instead (same image, same releases, just a different host).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Application ----------

  api:
    build: ./backend
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    extra_hosts:
      # Makes host.docker.internal resolve on native Linux Docker Engine too
      # (Docker Desktop on Mac/Windows already provides this).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    container_name: rag-worker
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "ingest"]
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy  # api runs schema/bucket setup on startup
    restart: unless-stopped
    # Scale with: docker compose up --scale worker=3
    deploy:
      replicas: 1

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  minio_data: